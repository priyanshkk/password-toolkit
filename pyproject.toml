[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "password-toolkit"
version = "0.1.0"
description = "Generate cryptographically secure passwords and estimate their strength from the terminal."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Priyanshu Kumar", email = "priyanshkk@users.noreply.github.com" }]
keywords = ["cli", "password", "security", "secrets"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.10", "build>=1.2"]

[project.scripts]
password-toolkit = "password_toolkit.__main__:main"

[project.urls]
Homepage = "https://github.com/priyanshkk/password-toolkit"
Repository = "https://github.com/priyanshkk/password-toolkit"
Issues = "https://github.com/priyanshkk/password-toolkit/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/password_toolkit"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
